<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BitNet PIM explainer — DRAM-as-compute, step by step</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1116;
    color: #e6e8ee;
    height: 100%;
  }
  body { display: flex; flex-direction: column; height: 100vh; }

  header {
    padding: 10px 18px;
    background: #161922;
    border-bottom: 1px solid #2a2f3d;
    display: flex; gap: 12px; align-items: center;
    flex-shrink: 0;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; color: #ffd479; }
  header .sub { color: #8a93a8; font-size: 13px; }

  nav { display: flex; gap: 4px; padding: 8px 18px; background: #131722; flex-wrap: wrap; flex-shrink: 0; }
  nav button {
    background: #1d2230; border: 1px solid #2a2f3d; color: #c3c9d8;
    padding: 4px 10px; cursor: pointer; border-radius: 4px; font-size: 12px;
  }
  nav button:hover { background: #262d3e; }
  nav button.active { background: #3a86ff; color: white; border-color: #3a86ff; }

  main {
    flex: 1; display: grid; grid-template-columns: 1fr 380px; gap: 16px;
    padding: 14px 18px; min-height: 0;
  }

  .stage {
    background: #131722; border: 1px solid #2a2f3d; border-radius: 6px;
    display: flex; flex-direction: column; min-height: 0;
  }
  .stage-title { padding: 10px 14px; border-bottom: 1px solid #2a2f3d; font-size: 14px; color: #ffd479; }
  .canvas-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 8px; overflow: hidden; }
  .canvas-wrap svg { max-width: 100%; max-height: 100%; }

  .side {
    display: flex; flex-direction: column; gap: 12px; min-height: 0;
  }
  .caption, .codepane {
    background: #131722; border: 1px solid #2a2f3d; border-radius: 6px;
    padding: 12px 14px; font-size: 13px; line-height: 1.5;
  }
  .caption { color: #c3c9d8; min-height: 110px; }
  .caption b { color: #ffd479; }
  .caption .ex { color: #22c1c3; font-weight: 600; }
  .caption code { background: #1f2434; padding: 1px 5px; border-radius: 3px; font-size: 12px; color: #ffd479; }
  .codepane { font-family: ui-monospace, monospace; font-size: 11.5px; color: #8a93a8; overflow: auto; max-height: 280px; }
  .codepane .hl { color: #ffd479; }
  .codepane .cm { color: #5a6178; font-style: italic; }
  .codepane .src { display: block; color: #4f9bff; margin-top: 6px; margin-bottom: 2px; font-size: 11px; font-weight: 600; }

  .controls {
    padding: 10px 18px; background: #161922; border-top: 1px solid #2a2f3d;
    display: flex; gap: 10px; align-items: center; flex-shrink: 0;
  }
  .controls button {
    background: #1d2230; border: 1px solid #2a2f3d; color: #e6e8ee;
    padding: 6px 14px; cursor: pointer; border-radius: 4px; font-size: 13px;
  }
  .controls button:hover { background: #262d3e; }
  .controls button:disabled { opacity: 0.4; cursor: not-allowed; }
  .controls .step { color: #8a93a8; font-size: 13px; margin-left: 8px; }
  .controls .step b { color: #e6e8ee; }
  .controls .scenefoot { color: #5a6178; font-size: 12px; margin-left: auto; }

  /* SVG element styling */
  .cap { fill: #3a86ff; stroke: #4f9bff; }
  .cap.empty { fill: #1d2230; stroke: #4f9bff; }
  .cap.half { fill: #6b8ec9; stroke: #4f9bff; }
  .cap.frac { fill: #6b8ec9; stroke: #ffd479; }
  .row-line { stroke: #ffd479; stroke-width: 1.5; }
  .row-line.dim { stroke: #5a6178; stroke-width: 1; }
  .bitline { stroke: #5e6678; stroke-width: 1; }
  .bitline.hot { stroke: #3a86ff; stroke-width: 2; }
  .bitline.partial { stroke: #6b8ec9; stroke-width: 1.5; }
  .bitline.cold { stroke: #5e6678; stroke-width: 1; }
  .sense-amp { fill: #2a3142; stroke: #4f9bff; }
  .sense-amp.latched { fill: #3a86ff; stroke: #4f9bff; }
  .sense-amp.partial { fill: #6b8ec9; stroke: #4f9bff; }
  .label { fill: #c3c9d8; font-family: monospace; font-size: 11px; }
  .label.dim { fill: #5a6178; }
  .label.hl { fill: #ffd479; }
  .label.cyan { fill: #22c1c3; }
  .arrow { stroke: #ffd479; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
</style>
</head>
<body>
<header>
  <h1>BitNet PIM — DRAM as the compute substrate</h1>
  <span class="sub">Mechanism grounded in SiMRA, FracDRAM, FCDRAM, POPCNT3 + our project's server code</span>
</header>

<nav id="nav"></nav>

<main>
  <div class="stage">
    <div class="stage-title" id="stage-title">—</div>
    <div class="canvas-wrap"><svg id="canvas" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet">
      <defs>
        <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
          <polygon points="0 0, 8 4, 0 8" fill="#ffd479"/>
        </marker>
      </defs>
      <g id="scene"></g>
    </svg></div>
  </div>
  <aside class="side">
    <div class="caption" id="caption">—</div>
    <div class="codepane" id="codepane">—</div>
  </aside>
</main>

<div class="controls">
  <button id="prevBtn">◀ Prev</button>
  <button id="playBtn">▶ Play</button>
  <button id="nextBtn">Next ▶</button>
  <span class="step">Step <b id="stepNum">1</b> / <b id="stepMax">1</b></span>
  <span class="scenefoot" id="scenefoot">Scene 1 of 10</span>
</div>

<script>
const SVG_NS = 'http://www.w3.org/2000/svg';
const sceneRoot = document.getElementById('scene');
const captionEl = document.getElementById('caption');
const codeEl    = document.getElementById('codepane');
const titleEl   = document.getElementById('stage-title');
const stepNumEl = document.getElementById('stepNum');
const stepMaxEl = document.getElementById('stepMax');
const sceneFoot = document.getElementById('scenefoot');
const nav       = document.getElementById('nav');

function el(name, attrs = {}, children = []) {
  const e = document.createElementNS(SVG_NS, name);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  for (const c of children) e.appendChild(c);
  return e;
}
function text(x, y, str, cls = 'label', anchor = 'middle') {
  const t = el('text', { x, y, class: cls, 'text-anchor': anchor, 'dominant-baseline': 'middle' });
  t.textContent = str;
  return t;
}
function rect(x, y, w, h, cls, extra={}) {
  return el('rect', Object.assign({ x, y, width: w, height: h, class: cls, rx: 1, ry: 1 }, extra));
}
function line(x1, y1, x2, y2, cls) {
  return el('line', { x1, y1, x2, y2, class: cls });
}
function clearScene() { sceneRoot.innerHTML = ''; }

// =============================================================
// SCENE 1 — DRAM hierarchy
// =============================================================
const scene1 = {
  title: 'Scene 1 — DRAM hierarchy (zoom out)',
  steps: 5,
  render(step) {
    clearScene();
    const stages = [
      'one CELL = 1 access transistor + 1 capacitor (1T1C)',
      'thousands of cells share one wordline → one ROW',
      'rows + their local sense amps → SUBARRAY (PuD operations live here)',
      'subarrays share I/O → BANK (one open row at a time)',
      '16 banks per rank (4 groups × 4); typically 1–4 ranks per DIMM (DDR4 UDIMM/RDIMM)',
    ];
    sceneRoot.appendChild(text(500, 30, stages[step], 'label hl'));

    if (step === 0) {
      sceneRoot.appendChild(line(150, 300, 850, 300, 'row-line'));
      sceneRoot.appendChild(text(890, 300, 'wordline', 'label'));
      sceneRoot.appendChild(line(500, 100, 500, 550, 'bitline'));
      sceneRoot.appendChild(text(540, 110, 'bitline', 'label'));
      sceneRoot.appendChild(rect(480, 280, 40, 40, 'sense-amp'));
      sceneRoot.appendChild(text(500, 270, 'access transistor', 'label dim'));
      sceneRoot.appendChild(line(490, 350, 510, 350, 'row-line'));
      sceneRoot.appendChild(line(490, 360, 510, 360, 'row-line'));
      sceneRoot.appendChild(line(500, 320, 500, 350, 'bitline'));
      sceneRoot.appendChild(line(500, 360, 500, 400, 'bitline'));
      sceneRoot.appendChild(rect(470, 400, 60, 30, 'cap'));
      sceneRoot.appendChild(text(500, 415, '1 bit', 'label hl'));
      sceneRoot.appendChild(text(500, 470, 'cap holds a small charge; leaks over time; needs periodic refresh', 'label dim'));
    }
    else if (step === 1) {
      const N = 16;
      const x0 = 150, dx = 44;
      sceneRoot.appendChild(line(120, 200, 850, 200, 'row-line'));
      sceneRoot.appendChild(text(880, 200, 'wordline', 'label'));
      for (let i = 0; i < N; i++) {
        const x = x0 + i * dx;
        sceneRoot.appendChild(line(x, 100, x, 450, 'bitline'));
        sceneRoot.appendChild(rect(x-12, 250, 24, 24, i % 3 === 0 ? 'cap empty' : 'cap'));
      }
      sceneRoot.appendChild(text(500, 360, 'one wordline pulse opens ALL cells in the row at once', 'label dim'));
      sceneRoot.appendChild(text(500, 390, '⟹ DRAM access is fundamentally row-granular', 'label hl'));
    }
    else if (step === 2) {
      const W = 700, x0 = 150;
      const numRows = 8;
      const rowHeight = 30, y0 = 100;
      for (let r = 0; r < numRows; r++) {
        const y = y0 + r * rowHeight;
        sceneRoot.appendChild(line(x0, y, x0 + W, y, 'row-line dim'));
        sceneRoot.appendChild(text(x0 - 25, y, `r${r}`, 'label dim'));
      }
      const N = 16, dx = W / N;
      for (let i = 0; i < N; i++) {
        const x = x0 + i * dx + dx/2;
        sceneRoot.appendChild(line(x, y0 - 10, x, y0 + numRows * rowHeight + 60, 'bitline'));
      }
      const saY = y0 + numRows * rowHeight + 30;
      sceneRoot.appendChild(rect(x0, saY, W, 30, 'sense-amp'));
      sceneRoot.appendChild(text(x0 + W + 60, saY + 15, 'sense amps', 'label hl'));
      sceneRoot.appendChild(text(500, saY + 90, 'PuD ops (RowCopy, MAJ, ...) all happen INSIDE one subarray', 'label hl'));
      sceneRoot.appendChild(text(500, saY + 115, 'because they rely on shared local sense amps and bitlines', 'label dim'));
    }
    else if (step === 3) {
      const numSub = 4;
      const subH = 90, subW = 600, x0 = 200, y0 = 100;
      for (let i = 0; i < numSub; i++) {
        const y = y0 + i * (subH + 15);
        sceneRoot.appendChild(rect(x0, y, subW, subH, 'sense-amp'));
        sceneRoot.appendChild(text(x0 - 50, y + subH/2, `sub ${i}`, 'label'));
        sceneRoot.appendChild(rect(x0+5, y + subH - 12, subW - 10, 6, 'sense-amp latched'));
      }
      sceneRoot.appendChild(rect(x0 + subW + 20, y0, 30, numSub*(subH+15)-15, 'sense-amp latched'));
      sceneRoot.appendChild(text(x0 + subW + 90, y0 + 30, 'shared I/O', 'label hl'));
      sceneRoot.appendChild(text(500, 530, 'a bank serves one open row at a time across its subarrays', 'label dim'));
    }
    else if (step === 4) {
      const cellW = 90, cellH = 60, gap = 8, x0 = 200, y0 = 100;
      const groupColors = ['#3a86ff', '#ffd479', '#22c1c3', '#ff6b6b'];
      for (let bg = 0; bg < 4; bg++) {
        for (let b = 0; b < 4; b++) {
          const x = x0 + bg*(cellW + gap*4);
          const y = y0 + b*(cellH + gap);
          sceneRoot.appendChild(rect(x, y, cellW, cellH, '', { fill: '#1d2230', stroke: groupColors[bg], 'stroke-width': 1.5, rx: 3 }));
          sceneRoot.appendChild(text(x + cellW/2, y + cellH/2, `BG${bg}/B${b}`, 'label'));
        }
        sceneRoot.appendChild(text(x0 + bg*(cellW + gap*4) + cellW/2, y0 - 15, `bank group ${bg}`, 'label dim'));
      }
      sceneRoot.appendChild(text(500, 470, '16 banks per rank, 1-2 ranks per DIMM (DDR4 standard)', 'label hl'));
    }
  },
  caption(step) {
    const c = [
      `<b>One bit lives in a capacitor.</b> The access transistor connects/disconnects it from the bitline. Charge leaks away — DRAM needs periodic refresh (~64 ms in DDR4) to survive.`,
      `<b>A row = thousands of cells sharing one wordline.</b> Activating the wordline opens all cells in the row simultaneously onto their bitlines. <em>That's why DRAM access is row-granular.</em>`,
      `<b>A subarray = rows that share local bitlines and sense amps.</b> The sense amps are the row buffer. <b>All PuD operations (RowCopy, MAJ, ...) live inside one subarray</b> because they depend on these shared sense amps.`,
      `<b>A bank = subarrays sharing I/O.</b> Only one row open at a time per bank.`,
      `<b>DDR4 organisation:</b> 16 banks per rank (4 groups × 4), 1–2 ranks per DIMM. Cross-bank-group commands have tighter timing parameters than same-group commands.`,
    ];
    return c[step];
  },
  codeRef() { return '<span class="cm">(general DRAM, no project-specific link)</span>'; }
};

// =============================================================
// SCENE 2 — One cell: write, destructive read, write-back
// =============================================================
const scene2 = {
  title: 'Scene 2 — One cell: write, destructive read, write-back',
  steps: 5,
  render(step) {
    clearScene();
    sceneRoot.appendChild(text(500, 30, 'one cell, one bitline, one sense amp', 'label hl'));

    sceneRoot.appendChild(line(150, 270, 850, 270, step >= 1 ? 'row-line' : 'bitline'));
    sceneRoot.appendChild(text(890, 270, 'wordline', 'label'));

    const blClass = step === 0 ? 'bitline' : step === 1 ? 'bitline partial' : step === 2 ? 'bitline hot' : step === 3 ? 'bitline hot' : 'bitline';
    sceneRoot.appendChild(line(500, 100, 500, 500, blClass));
    sceneRoot.appendChild(text(540, 110, 'bitline', 'label'));

    sceneRoot.appendChild(rect(480, 255, 40, 30, step >= 1 ? 'sense-amp latched' : 'sense-amp'));

    const capStates = ['cap', 'cap', 'cap empty', 'cap empty', 'cap'];
    sceneRoot.appendChild(rect(470, 390, 60, 30, capStates[step]));
    sceneRoot.appendChild(line(490, 385, 510, 385, 'row-line'));
    sceneRoot.appendChild(line(490, 380, 510, 380, 'row-line'));
    sceneRoot.appendChild(line(500, 285, 500, 380, 'bitline'));
    sceneRoot.appendChild(line(500, 385, 500, 390, 'bitline'));

    const saClass = step === 0 ? 'sense-amp' :
                    step === 1 ? 'sense-amp partial' :
                    step === 2 || step === 3 ? 'sense-amp latched' : 'sense-amp';
    sceneRoot.appendChild(rect(440, 85, 120, 30, saClass));
    sceneRoot.appendChild(text(500, 100, 'sense amp', 'label'));

    const ann = [
      'IDLE: wordline OFF, bitline precharged to V_DD/2',
      'ACT: wordline ON → cap charge shares with bitline',
      'sense amp resolves → bitline driven to V_DD or GND',
      'READ pulls value — but cap is now drained (destructive)',
      'PRE: sense amp writes value back → wordline OFF → bitline precharges'
    ];
    sceneRoot.appendChild(text(500, 540, ann[step], 'label hl'));
  },
  caption(step) {
    const c = [
      `<b>Idle.</b> Cap holds its charge (representing 1 or 0). Bitline is precharged to V_DD/2 (mid-rail). Wordline OFF — cell is isolated.`,
      `<b>ACT.</b> Wordline goes high → access transistor opens → cap connects to bitline. The cap's small charge nudges the bitline slightly above or below V_DD/2 (charge sharing).`,
      `<b>Sense amp resolves.</b> A pair of cross-coupled inverters amplifies the tiny perturbation to full-rail. The bitline is now driven to V_DD or GND. <b>This is the row buffer.</b>`,
      `<b>READ.</b> Column decoder picks columns out of the sense amp band to the I/O bus. <em>Notice: the cap itself is now empty — its charge drained into the bitline.</em> DRAM reads are <b>destructive</b>.`,
      `<b>PRE (precharge).</b> Sense amp drives the cap back to its original value, wordline goes OFF, then the bitline returns to V_DD/2. Cell is restored.`,
    ];
    return c[step];
  },
  codeRef() { return '<span class="cm">(general DRAM, no project-specific link)</span>'; }
};

// =============================================================
// SCENE 3 — Normal ACT / READ / PRE on a row
// =============================================================
const scene3 = {
  title: 'Scene 3 — ACT / READ / PRE on a whole row',
  steps: 4,
  render(step) {
    clearScene();
    const N = 12;
    const x0 = 120, dx = 60, y0 = 120;
    const wlActive = step >= 1 && step <= 3;
    sceneRoot.appendChild(line(80, y0, x0 + N*dx, y0, wlActive ? 'row-line' : 'bitline'));
    sceneRoot.appendChild(text(50, y0, 'WL', 'label hl'));

    for (let i = 0; i < N; i++) {
      const x = x0 + i*dx;
      const blState = step === 0 ? 'bitline' : step === 1 ? 'bitline partial' : 'bitline hot';
      sceneRoot.appendChild(line(x, 60, x, 460, blState));
      const bit = i % 2;
      const capCls = (step >= 3 ? 'cap' : (step === 2 ? 'cap empty' : 'cap')) + (bit ? '' : ' empty');
      sceneRoot.appendChild(rect(x-12, 350, 24, 24, capCls));
      sceneRoot.appendChild(rect(x-12, y0-12, 24, 24, wlActive ? 'sense-amp latched' : 'sense-amp'));
    }
    const saCls = step === 0 ? 'sense-amp' : step === 1 ? 'sense-amp partial' : 'sense-amp latched';
    sceneRoot.appendChild(rect(x0 - 30, 250, N*dx + 20, 30, saCls));
    sceneRoot.appendChild(text(x0 + N*dx + 40, 265, 'sense amps (row buffer)', 'label hl'));

    const phases = ['IDLE', 'ACT', 'READ (cap drains; row buffer is the only copy)', 'PRE (sense amp restores cap, wordline off)'];
    sceneRoot.appendChild(text(500, 510, phases[step], 'label hl'));
    sceneRoot.appendChild(text(500, 535, 'DDR4 timing rules: tRAS ≥ ACT-to-PRE; tRP ≥ PRE-to-next-ACT (JEDEC spec)', 'label dim'));
  },
  caption(step) {
    const c = [
      `<b>Idle.</b> Bank's row buffer empty. Bitlines at V_DD/2.`,
      `<b>ACT row R.</b> All cells in R drop their charges onto bitlines simultaneously. Sense amps resolve to full rail. <b>Row buffer = row R.</b>`,
      `<b>READ col.</b> Column decoder picks an N-byte slice from the row buffer to the I/O bus. Cells in R are now drained — row buffer is the only copy.`,
      `<b>PRE.</b> Sense amps write their values back into R. Wordline OFF, bitlines precharge to V_DD/2. <em>SiMRA, FracDRAM, FCDRAM all bend this 3-phase cycle by violating tRAS or tRP — that's where in-DRAM compute comes from.</em>`,
    ];
    return c[step];
  },
  codeRef() { return '<span class="cm">(general DRAM, no project-specific link)</span>'; }
};

// =============================================================
// SCENE 4 — The APA primitive
// =============================================================
const scene4 = {
  title: 'Scene 4 — The APA primitive (ACT — wait t₁ — PRE — wait t₂ — ACT)',
  steps: 5,
  render(step) {
    clearScene();
    sceneRoot.appendChild(text(500, 30, 'one envelope, three different operations depending on (t₁, t₂)', 'label hl'));

    // Timing diagram
    const tx0 = 100, txw = 800, ty = 180;
    // Baseline timing axis
    sceneRoot.appendChild(line(tx0, ty + 40, tx0 + txw, ty + 40, 'bitline'));
    sceneRoot.appendChild(text(tx0 + txw + 30, ty + 40, 'time →', 'label dim'));

    // Three commands as boxes
    const c1x = tx0 + 50, c2x = tx0 + 350, c3x = tx0 + 600;
    const boxW = 80, boxH = 40;

    sceneRoot.appendChild(rect(c1x, ty + 20, boxW, boxH, step >= 1 ? 'sense-amp latched' : 'sense-amp'));
    sceneRoot.appendChild(text(c1x + boxW/2, ty + 40, 'ACT R_F', 'label hl'));

    sceneRoot.appendChild(rect(c2x, ty + 20, boxW, boxH, step >= 3 ? 'sense-amp latched' : 'sense-amp'));
    sceneRoot.appendChild(text(c2x + boxW/2, ty + 40, 'PRE', 'label hl'));

    sceneRoot.appendChild(rect(c3x, ty + 20, boxW, boxH, step >= 4 ? 'sense-amp latched' : 'sense-amp'));
    sceneRoot.appendChild(text(c3x + boxW/2, ty + 40, 'ACT R_S', 'label hl'));

    // Gap annotations
    if (step >= 2) {
      sceneRoot.appendChild(line(c1x + boxW, ty + 90, c2x, ty + 90, 'arrow'));
      sceneRoot.appendChild(text((c1x + boxW + c2x)/2, ty + 110, 't₁', 'label hl'));
      sceneRoot.appendChild(text((c1x + boxW + c2x)/2, ty + 128, '(gap 1)', 'label dim'));
    }
    if (step >= 3) {
      sceneRoot.appendChild(line(c2x + boxW, ty + 90, c3x, ty + 90, 'arrow'));
      sceneRoot.appendChild(text((c2x + boxW + c3x)/2, ty + 110, 't₂', 'label hl'));
      sceneRoot.appendChild(text((c2x + boxW + c3x)/2, ty + 128, '(gap 2)', 'label dim'));
    }

    // JEDEC vs APA rules
    if (step >= 2) {
      sceneRoot.appendChild(text(500, 380, 'JEDEC spec:  t₁ ≥ tRAS  (~tens of ns)   AND   t₂ ≥ tRP  (~tens of ns)', 'label dim'));
      sceneRoot.appendChild(text(500, 405, 'APA breaks one or both — chooses t₁, t₂ to produce a specific in-DRAM operation', 'label hl'));
    }

    // Outcome table preview
    if (step >= 4) {
      const ty2 = 450;
      sceneRoot.appendChild(text(500, ty2, '(t₁, t₂) determines what happens:', 'label hl'));
      const rows = [
        ['t₁ long  (≥ tRAS), t₂ short', '→  RowCopy / Multi-RowCopy', '(Scene 5)'],
        ['t₁ short, t₂ short',           '→  Multi-Row Activation, then MAJ', '(Scene 6)'],
        ['PRE  ACT  PRE  back-to-back',  '→  Frac (cell ← V_DD/2)', '(Scene 6)'],
      ];
      for (let i = 0; i < rows.length; i++) {
        const y = ty2 + 25 + i*22;
        sceneRoot.appendChild(text(250, y, rows[i][0], 'label'));
        sceneRoot.appendChild(text(560, y, rows[i][1], 'label hl'));
        sceneRoot.appendChild(text(740, y, rows[i][2], 'label dim'));
      }
    }
  },
  caption(step) {
    const c = [
      `<b>The primitive.</b> All in-DRAM compute we use is built from <b>one command envelope</b>: ACT, then PRE, then ACT. Both ACTs target rows in the same subarray.`,
      `<b>First ACT.</b> Opens row R_F. Sense amp begins to resolve.`,
      `<b>Then wait t₁.</b> The gap between ACT₁ and PRE — controllable by the controller. Standard DDR4 demands t₁ ≥ tRAS, but APA can shorten it.`,
      `<b>PRE, then wait t₂.</b> The gap between PRE and ACT₂. Standard DDR4 demands t₂ ≥ tRP. Again, APA can shorten it.`,
      `<b>Different (t₁, t₂) → different operations.</b> The bitline / sense amp ends up in different physical states depending on how much settling was allowed at each gap. <span class="ex">EXAMPLE values from one chip family appear in later scenes — the specific numbers vary across DDR4 manufacturers.</span>`,
    ];
    return c[step];
  },
  codeRef() {
    return `<span class="src">paper: SiMRA §3.2 — APA defined</span>
<span class="cm">"ACT R_F — wait t₁ — PRE — wait t₂ — ACT R_S"</span>
<span class="cm">Both R_F, R_S target the same subarray.</span>

<span class="src">code: util.cpp:242-286 (our doubleACT)</span>
<span class="cm">// Cmd:    ----|ACT R0|----| PRE |----|ACT R3|----</span>
<span class="cm">// Gaps:               t_12          t_23</span>

q_inst[<span class="hl">0</span>]                = SMC_ACT(BAR, RF_REG);

  stepMaxEl.textContent = s.steps;
  sceneFoot.textContent = `Scene ${curScene+1} of ${SCENES.length}`;
  document.getElementById('prevBtn').disabled = (curScene === 0 && curStep === 0);
  document.getElementById('nextBtn').disabled = (curScene === SCENES.length-1 && curStep === s.steps-1);
}

document.getElementById('prevBtn').onclick = () => {
  if (curStep > 0) curStep--;
  else if (curScene > 0) { curScene--; curStep = SCENES[curScene].steps - 1; }
  render();
};
document.getElementById('nextBtn').onclick = () => {
  const s = SCENES[curScene];
  if (curStep < s.steps - 1) curStep++;
  else if (curScene < SCENES.length - 1) { curScene++; curStep = 0; }
  render();
};
document.getElementById('playBtn').onclick = () => {
  const btn = document.getElementById('playBtn');
  if (playTimer) {
    clearInterval(playTimer); playTimer = null; btn.textContent = '▶ Play';
  } else {
    btn.textContent = '⏸ Pause';
    playTimer = setInterval(() => {
      const s = SCENES[curScene];
      if (curStep < s.steps - 1) curStep++;
      else if (curScene < SCENES.length - 1) { curScene++; curStep = 0; }
      else { clearInterval(playTimer); playTimer = null; btn.textContent = '▶ Play'; return; }
      render();
    }, 2800);
  }
};

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') document.getElementById('nextBtn').click();
  if (e.key === 'ArrowLeft') document.getElementById('prevBtn').click();
  if (e.key === ' ') { e.preventDefault(); document.getElementById('playBtn').click(); }
});

render();
</script>
</body>
</html>
