# =============================================================================
# DIMM_POPULATION.conf — the single source of truth for what is in the sockets
# =============================================================================
# Maintain this file ONLY when the physical DIMM population changes. Everything
# else derives from it at run time: `python/dimm_population.py` reads it and
# hands every tool the per-channel fixture trio (calibration file, per-bank pool
# layout, sub-array row window) and the per-channel lane role. Nothing else may
# hardcode roles, fixture names or windows — a compiled-in role table for a
# population that had already been replaced cost 1.43x of the wall on half the
# channels and went unnoticed for weeks.
#
# Format: plain KEY=VALUE, shell-sourceable and Python-parseable. '#' comments.
#
# This file describes OUR reference population. Edit it for yours; the shipped
# values are what the calibration/ fixtures in this repository were measured on.
# =============================================================================

POP_DATE=2026-08-16
POP_DESC="4x dual-rank SK hynix HMA41GU6AFR8N-TF (H5AN4G8NAFR, 4Gb x8, 2^15 rows per bank per rank), one module per channel, same part number, different manufacturing weeks."

# ---- per-slot module identity + lane role -----------------------------------
# ROLE values: compute | storage.
#   compute — the channel runs charge-sharing primitives (MAJ3, broadcast,
#             RowClone) and holds resident weights and resident constants.
#   storage — the channel is used as addressable capacity only: RowClone and
#             ordinary read/write, no majority gates.
# The role is a PROPERTY OF THE DEPLOYMENT, not of the part. A module that is
# MAJ3-capable can still be given the storage role (to park weights or KV
# pages); a module with no usable MAJ3 yield can only be given storage.
POP_SLOT0_MODULE="HMA41GU6AFR8N-TF"
POP_SLOT0_ROLE=compute
POP_SLOT1_MODULE="HMA41GU6AFR8N-TF"
POP_SLOT1_ROLE=compute
POP_SLOT2_MODULE="HMA41GU6AFR8N-TF"
POP_SLOT2_ROLE=compute
POP_SLOT3_MODULE="HMA41GU6AFR8N-TF"
POP_SLOT3_ROLE=compute

# ---- the fixture trio -------------------------------------------------------
# One calibrated trio serves every channel of this population: the pool is
# clone-ok on all four, the co-activation fault graph is byte-identical across
# all four, and the trio runs the full model token-exact on the channels it has
# been driven on. Same part number, four manufacturing dates — see
# docs/CALIBRATION.md for what that does and does not license.
# {bank} is substituted with the bank index.
POP_TRIO_CALIB=calib_dimm2.txt
POP_TRIO_POOL=pool_layout_dimm2_cloneok_bank{bank}.txt
POP_TRIO_SUB_START=45312
POP_TRIO_SUB_END=45952
# POP_TRIO_COLMASK=fused_colmask_bank{bank}.txt   # optional, per-die column repair
